# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Increased heap memory to 4096m with G1GC to maximize build performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enable Gradle build cache and parallel task execution to optimize build times
org.gradle.caching=true
org.gradle.parallel=true

# Configuration Cache settings
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false

# Kotlin incremental compilation for faster build times
kotlin.incremental=true
kotlin.code.style=official

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync
org.gradle.tooling.parallel=true
